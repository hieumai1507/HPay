services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: HPay
      POSTGRES_PASSWORD: HPay
      POSTGRES_DB: HPay
    ports: ["127.0.0.1:5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U HPay"]
      interval: 3s
      retries: 10
  redis:
    image: redis:7-alpine
    ports: ["127.0.0.1:6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      retries: 10
  app:
    build: .
    profiles: ["app"]   # docker compose --profile app up — in dev you usually run `go run` instead
    environment:
      APP_ENV: dev
      DATABASE_URL: postgres://HPay:HPay@postgres:5432/HPay?sslmode=disable
      REDIS_ADDR: redis:6379
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-me-32-bytes-min!!}
    ports: ["127.0.0.1:8080:8080"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
