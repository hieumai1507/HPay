openapi: 3.0.3
info:
  title: HPay API
  version: 0.10.0
  description: >
    Contract-first spec — one-to-one with internal/api/router.go.
    All money amounts are int64 minor units (VND dong).
    Every POST that creates money movement requires the Idempotency-Key header;
    replaying the same key returns the ORIGINAL transaction with HTTP 200.
    Errors always use the Error schema with a stable ERR_* code.
servers:
  - url: http://localhost:8080

paths:
  /healthz:
    get:
      tags: [system]
      summary: Liveness/readiness of postgres + redis
      responses:
        "200":
          description: healthy
          content:
            {
              application/json:
                { schema: { $ref: "#/components/schemas/Health" } },
            }
        "503":
          description: degraded (one or more dependencies down)
          content:
            {
              application/json:
                { schema: { $ref: "#/components/schemas/Health" } },
            }

  /internal/mock-bank/callback:
    post:
      tags: [system]
      summary: Mock bank topup notification (F10 E15) — idempotent by ref_code
      description:
        Internal-only; guarded by the X-Mock-Bank-Secret header, blocked at the
        proxy in any real deployment. The first callback for a topup at status
        'created' posts the ledger legs and completes it; repeats move no money.
        Every callback books a bank_statements row, so duplicates and amount
        mismatches surface in reconciliation.
      parameters:
        - name: X-Mock-Bank-Secret
          in: header
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ref_code, amount]
              properties:
                ref_code: { type: string }
                amount:
                  {
                    type: integer,
                    format: int64,
                    description: minor units (VND dong),
                  }
                bank_ref: { type: string }
      responses:
        "200":
          description: processed (duplicate=true when no money moved)
          content:
            application/json:
              schema:
                type: object
                properties:
                  ref_code: { type: string }
                  status: { type: string }
                  duplicate: { type: boolean }
        "401":
          description: ERR_INVALID_CALLBACK_SECRET
          content:
            {
              application/json:
                { schema: { $ref: "#/components/schemas/Error" } },
            }
        "404":
          description: ERR_TXN_NOT_FOUND
          content:
            {
              application/json:
                { schema: { $ref: "#/components/schemas/Error" } },
            }
        "422":
          description: ERR_CALLBACK_AMOUNT_MISMATCH (statement still booked)
          content:
            {
              application/json:
                { schema: { $ref: "#/components/schemas/Error" } },
            }

  /v1/auth/register:
    post:
      tags: [auth]
      summary: Register a new user (rate-limited 5/min/IP)
      parameters: [{ $ref: "#/components/parameters/DeviceId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone, password, full_name]
              properties:
                phone:
                  { type: string, pattern: '^0\d{9}$', example: "0912345678" }
                password: { type: string, minLength: 8, maxLength: 72 }
                full_name: { type: string, minLength: 2, maxLength: 120 }
      responses:
        "201":
          description: user created; main wallet auto-provisioned
          content:
            {
              application/json:
                { schema: { $ref: "#/components/schemas/AuthResponse" } },
            }
        "400": { $ref: "#/components/responses/Validation" }
        "409": { description: ERR_PHONE_TAKEN }
        "429": { description: ERR_RATE_LIMITED }

  /v1/auth/login:
    post:
      tags: [auth]
      summary: Login (rate-limited 5/min/IP; 5 failed logins lock the account for 15 minutes; errors and timing do not reveal user existence)
      parameters: [{ $ref: "#/components/parameters/DeviceId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone, password]
              properties:
                phone: { type: string }
                password: { type: string }
      responses:
        "200":
          description: token pair issued (new refresh family)
          content:
            {
              application/json:
                { schema: { $ref: "#/components/schemas/AuthResponse" } },
            }
        "401": { description: ERR_INVALID_CREDENTIALS }
        "429": { description: "ERR_RATE_LIMITED (per IP) or ERR_LOGIN_LOCKED (5 failed logins lock the account for 15 minutes, even for the correct password)" }
        "403": { description: ERR_ACCOUNT_LOCKED }

  /v1/auth/refresh:
    post:
      tags: [auth]
      summary: Rotate refresh token (reuse detection revokes the whole family)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh_token]
              properties:
                refresh_token: { type: string }
      responses:
        "200":
          description: new access + refresh pair
          content:
            application/json:
              schema:
                type: object
                properties:
                  tokens: { $ref: "#/components/schemas/TokenPair" }
        "401":
          {
            description: ERR_INVALID_TOKEN / ERR_TOKEN_EXPIRED / ERR_TOKEN_REUSED (all sessions revoked),
          }

  /v1/auth/logout:
    post:
      tags: [auth]
      summary: Revoke the refresh token family (idempotent)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh_token]
              properties:
                refresh_token: { type: string }
      responses:
        "200": { description: ok }

  /v1/wallets:
    get:
      tags: [wallets]
      summary: List my wallets (main + vaults)
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: wallets
          content:
            application/json:
              schema:
                type: object
                required: [wallets]
                properties:
                  wallets:
                    type: array
                    items: { $ref: "#/components/schemas/Wallet" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /v1/users/me:
    get:
      tags: [users]
      summary: My profile + per-transaction limit for my KYC tier (server truth — clients must not hardcode the tier table)
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: profile + limit
          content:
            application/json:
              schema:
                type: object
                required: [user, txn_limit]
                properties:
                  user: { $ref: "#/components/schemas/User" }
                  txn_limit:
                    {
                      type: integer,
                      format: int64,
                      description: "per-transaction limit of the user's offer for P2P_TRANSFER (minor units, VND); 0 when the user has no usable offer",
                    }
                  offer:
                    type: object
                    description: the user's offer and its limits for P2P_TRANSFER (absent when the user has no usable offer)
                    properties:
                      code: { type: string, example: OFFER_CUST_L1 }
                      per_txn_limit: { type: integer, format: int64 }
                      daily_limit: { type: integer, format: int64 }
                      monthly_limit: { type: integer, format: int64 }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /v1/users/me/qr:
    get:
      tags: [users]
      summary: Get my static QR payload and signature
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: QR payload successfully minted
          content:
            application/json:
              schema:
                type: object
                required: [payload, signature, expires_at]
                properties:
                  payload: { type: string, description: "Base64url encoded JSON payload {user_id, name_masked, phone_masked, exp}" }
                  signature: { type: string, description: "HMAC signature" }
                  expires_at: { type: string, format: date-time }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /v1/qr/resolve:
    post:
      tags: [users]
      summary: Resolve QR payload + signature
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [payload, signature]
              properties:
                payload: { type: string }
                signature: { type: string }
      responses:
        "200":
          description: QR resolved successfully
          content:
            application/json:
              schema:
                type: object
                required: [name_masked, phone_masked, receiver_token, expires_at]
                properties:
                  name_masked: { type: string }
                  phone_masked: { type: string }
                  receiver_token: { type: string, description: "Stateless short-lived token representing the receiver user_id" }
                  expires_at: { type: string, format: date-time }
        "400":
          description: ERR_QR_INVALID (invalid signature or tampered data)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "410":
          description: ERR_QR_EXPIRED
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /v1/users/lookup:
    get:
      tags: [users]
      summary: Confirm a receiver exists before transferring (rate-limited 20/min/user; 404 is uniform for missing, inactive, and self — existence not probeable)
      security: [{ bearerAuth: [] }]
      parameters:
        - {
            name: phone,
            in: query,
            required: true,
            schema: { type: string, example: "0912345678" },
          }
      responses:
        "200":
          description: receiver found
          content:
            application/json:
              schema:
                type: object
                required: [found, masked_name]
                properties:
                  found: { type: boolean, enum: [true] }
                  masked_name:
                    {
                      type: string,
                      example: "Nguyễn V** A*",
                      description: server-masked — raw names never leave the API,
                    }
        "400": { $ref: "#/components/responses/Validation" }
        "404": { description: ERR_USER_NOT_FOUND }
        "429": { description: ERR_RATE_LIMITED }

  /v1/transactions:
    get:
      tags: [transactions]
      summary: My transaction history (keyset pagination — no offsets)
      security: [{ bearerAuth: [] }]
      parameters:
        - {
            name: cursor,
            in: query,
            schema: { type: string, format: date-time },
          }
        - { name: cursor_id, in: query, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: transactions + next_cursor / next_cursor_id
          content:
            application/json:
              schema:
                type: object
                required: [transactions]
                properties:
                  transactions:
                    type: array
                    items: { $ref: "#/components/schemas/TxnView" }
                  next_cursor: { type: string }
                  next_cursor_id: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /v1/transactions/{refCode}:
    get:
      tags: [transactions]
      summary: Transaction detail (owner only — 404 otherwise, existence not revealed)
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/RefCode" }]
      responses:
        "200":
          description: transaction
          content:
            {
              application/json:
                { schema: { $ref: "#/components/schemas/TxnView" } },
            }
        "404": { description: ERR_TXN_NOT_FOUND }

  /v1/transactions/{refCode}/timeline:
    get:
      tags: [transactions]
      summary: Public workflow step trail for an owned transaction
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/RefCode" }]
      responses:
        "200":
          description: instance status + steps; failure_code only when failed/compensated
          content:
            {
              application/json:
                { schema: { $ref: "#/components/schemas/Timeline" } },
            }
        "404": { description: ERR_TXN_NOT_FOUND }

  /v1/transactions/request:
    post:
      tags: [transactions]
      summary: Unified engine step 1/3 — start any money-moving service (P2P transfer, bank topup, pay a money-request, org disbursement, ...) by service_code
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [service_code, amount]
              properties:
                service_code:
                  {
                    type: string,
                    example: P2P_TRANSFER,
                    description: "P2P_TRANSFER | TOPUP_BANK | MONEY_REQUEST | ORG_DISBURSEMENT | VAULT_SAVINGS",
                  }
                amount:
                  {
                    type: integer,
                    format: int64,
                    description: minor units (VND),
                  }
                receiver_phone: { type: string, example: "0912345678" }
                receiver_id: { type: string, format: uuid }
                note: { type: string, maxLength: 255 }
                extra_params: { type: object }
      responses:
        "200":
          description: created — check auth_required and status. When auth_required is pin or otp the status is awaiting_auth and NOTHING has moved until /transactions/confirm succeeds; a request that needs 2fa is refused with ERR_AUTH_METHOD_UNAVAILABLE (ADR-0014)
          content:
            {
              application/json:
                { schema: { $ref: "#/components/schemas/EngineRequestResult" } },
            }
        "400":
          {
            description: ERR_AMOUNT_INVALID / ERR_LIMIT_EXCEEDED / ERR_SELF_TRANSFER / ERR_INSUFFICIENT_BALANCE / ERR_AMOUNT_BELOW_MIN / ERR_LIMIT_PER_TXN / ERR_LIMIT_DAILY / ERR_LIMIT_MONTHLY,
          }
        "403":
          {
            description: OfferGuard refused — ERR_SERVICE_NOT_IN_OFFER / ERR_SERVICE_DISABLED,
          }
        "404": { description: ERR_RECEIVER_NOT_FOUND }
        "409": { description: ERR_IDEMPOTENCY_KEY_REUSED (key already used by you with a different payload) }
        "429": { description: ERR_TOO_FREQUENT — offer interval_seconds throttle }

  /v1/transactions/challenge:
    post:
      tags: [transactions]
      summary: Issue the OTP for a transaction in the otp band (ADR-0014). The code is returned only when APP_ENV=dev; other environments deliver it out of band
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [transaction_id]
              properties:
                transaction_id: { type: string, format: uuid }
      responses:
        "200": { description: "{status: otp_sent} (plus otp_dev in dev)" }
        "404": { description: ERR_TXN_NOT_FOUND (also for another user's transaction) }
        "409": { description: ERR_ALREADY_CONFIRMED }
        "429": { description: ERR_RATE_LIMITED }

  /v1/transactions/confirm:
    post:
      tags: [transactions]
      summary: Unified engine step 2/3 — authenticate a transaction held in awaiting_auth with the server-verified PIN (plus OTP for the otp band, plus an authenticator code for the 2fa band) and start its workflow once (ADR-0014, ADR-0017). Calling it again returns the current state
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [transaction_id]
              properties:
                transaction_id: { type: string, format: uuid }
                pin: { type: string }
                otp: { type: string }
                totp: { type: string, description: "2fa band: a 6-digit authenticator code or a recovery code (ADR-0017); ignored in the pin and otp bands" }
      responses:
        "200":
          description: current transaction status — poll /timeline for settlement
          content:
            {
              application/json:
                { schema: { $ref: "#/components/schemas/TransferResult" } },
            }
        "400": { description: ERR_CREDENTIAL_REQUIRED }
        "403": { description: ERR_PIN_INCORRECT / ERR_PIN_NOT_SET }
        "404": { description: ERR_TXN_NOT_FOUND — unknown id AND another user's transaction }
        "410": { description: ERR_AUTH_EXPIRED — not confirmed within 10 minutes }
        "422": { description: ERR_AUTH_METHOD_UNAVAILABLE — the 2fa band has no provider yet }
        "429": { description: ERR_PIN_LOCKED — 5 wrong PINs lock PIN use for 15 minutes; ERR_RATE_LIMITED }

  /v1/me/pin:
    put:
      tags: [auth]
      summary: Set the first transaction PIN. Requires the account password (step-up). The PIN is stored only as an argon2id hash and is never returned or logged
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password, new_pin]
              properties:
                password: { type: string }
                new_pin: { type: string, description: "6 digits, not all the same digit and not a sequence" }
      responses:
        "200": { description: "{status: pin_set}" }
        "400": { description: ERR_PIN_WEAK / ERR_VALIDATION }
        "401": { description: ERR_INVALID_CREDENTIALS }
        "429": { description: ERR_RATE_LIMITED }
    patch:
      tags: [auth]
      summary: Change the transaction PIN. Requires the current PIN, which uses the same attempt counter and lockout as a payment confirmation
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [current_pin, new_pin]
              properties:
                current_pin: { type: string }
                new_pin: { type: string }
      responses:
        "200": { description: "{status: pin_changed}" }
        "400": { description: ERR_PIN_WEAK / ERR_VALIDATION }
        "403": { description: ERR_PIN_INCORRECT / ERR_PIN_NOT_SET }
        "429": { description: ERR_PIN_LOCKED / ERR_RATE_LIMITED }

  /v1/me/pin/reset/request:
    post:
      tags: [auth]
      summary: Start a forgotten-PIN reset (ADR-0016). Requires the account password; a one-time code is sent through the delivery port (never in the response outside dev)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                password: { type: string }
      responses:
        "200": { description: "{status: code_sent, expires_in}; dev adds otp_dev" }
        "400": { description: ERR_VALIDATION }
        "401": { description: ERR_INVALID_CREDENTIALS }
        "403": { description: ERR_PIN_NOT_SET }
        "429": { description: "ERR_OTP_COOLDOWN (30 s) / ERR_PIN_RESET_RATE_LIMITED (3 per hour) / ERR_RATE_LIMITED" }
        "503": { description: "ERR_OTP_DELIVERY_UNAVAILABLE (no real provider configured, fails closed)" }

  /v1/me/pin/reset/confirm:
    post:
      tags: [auth]
      summary: Finish the reset with the code and a new PIN. Clears the PIN lock and starts a 24 hour cooling period for large PIN transactions
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code, new_pin]
              properties:
                code: { type: string, description: "6 digits sent to the user" }
                new_pin: { type: string, description: "6 digits, not all the same digit and not a sequence" }
      responses:
        "200": { description: "{status: pin_reset}" }
        "400": { description: "ERR_PIN_WEAK (the code is not consumed) / ERR_OTP_INVALID / ERR_OTP_EXPIRED / ERR_OTP_MAX_ATTEMPTS / ERR_VALIDATION" }
        "429": { description: ERR_RATE_LIMITED }

  /v1/me/totp/enroll:
    post:
      tags: [auth]
      summary: Start enrolment of an authenticator app (ADR-0017). Needs the account password and an existing PIN. The secret and the otpauth URI are returned once, here and nowhere else; the secret is stored encrypted
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                password: { type: string }
      responses:
        "200": { description: "{status: pending, secret, otpauth_uri}" }
        "400": { description: ERR_VALIDATION }
        "401": { description: ERR_INVALID_CREDENTIALS }
        "403": { description: ERR_PIN_NOT_SET }
        "409": { description: ERR_TOTP_ALREADY_ENABLED }

  /v1/me/totp/confirm:
    post:
      tags: [auth]
      summary: Activate the authenticator with a first valid code; returns 10 single-use recovery codes once
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: { type: string, description: "6 digits from the authenticator app" }
      responses:
        "200": { description: "{status: totp_enabled, recovery_codes: [..10]}" }
        "400": { description: "ERR_TOTP_INVALID / ERR_VALIDATION" }
        "403": { description: ERR_TOTP_NOT_ENROLLED }
        "429": { description: "ERR_TOTP_LOCKED (5 wrong codes lock TOTP use for 15 minutes)" }

  /v1/me/totp:
    get:
      tags: [auth]
      summary: Whether an authenticator is active and how many recovery codes are left. Never returns the secret
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: "{enabled, recovery_codes_left}" }

  /v1/transactions/verify:
    post:
      tags: [transactions]
      summary: Unified engine step 3/3 — verify the 2FA code for a high-value transaction
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [transaction_id, two_fa_code]
              properties:
                transaction_id: { type: string, format: uuid }
                two_fa_code: { type: string }
      responses:
        "200":
          description: current transaction status — poll /timeline for settlement
          content:
            {
              application/json:
                { schema: { $ref: "#/components/schemas/TransferResult" } },
            }
        "404": { description: ERR_TXN_NOT_FOUND }

  /v1/fees/preview:
    get:
      tags: [transactions]
      summary: Fee the caller would pay for a p2p transfer right now (their KYC tier)
      security: [{ bearerAuth: [] }]
      parameters:
        - {
            name: amount,
            in: query,
            required: true,
            schema: { type: integer, format: int64 },
          }
      responses:
        "200":
          description: fee quote for the caller's current KYC tier
          content:
            application/json:
              schema:
                type: object
                required: [amount, fee, total]
                properties:
                  amount: { type: integer, format: int64 }
                  fee: { type: integer, format: int64 }
                  total: { type: integer, format: int64 }
        "400": { $ref: "#/components/responses/Validation" }

  /v1/vaults:
    get:
      tags: [vaults]
      summary: List the caller's savings vaults
      description: >
        Vault metadata only. Money moves in and out through
        POST /v1/transactions/request with service_code=VAULT_SAVINGS and
        extra_params {vault_id, direction}, so vaults inherit OfferGuard limits,
        the auth matrix and idempotency rather than having their own money path.
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: vaults owned by the caller
          content:
            application/json:
              schema:
                type: object
                properties:
                  vaults:
                    type: array
                    items: { $ref: "#/components/schemas/Vault" }
    post:
      tags: [vaults]
      summary: Create a savings vault
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [label]
              properties:
                label: { type: string, maxLength: 60, example: "Du lịch Đà Lạt" }
                target_amount:
                  {
                    type: integer,
                    format: int64,
                    description: optional savings goal, display only,
                  }
      responses:
        "201":
          description: created
          content:
            application/json:
              { schema: { $ref: "#/components/schemas/Vault" } }
        "400": { description: ERR_VALIDATION }
        "409": { description: ERR_VAULT_LABEL_TAKEN }

  /v1/vaults/{id}/round-up-target:
    patch:
      tags: [vaults]
      summary: Set or clear this vault as the caller's round-up destination
      description: >
        Enables/disables the optional ROUND_UP workflow step for this vault
        (docs 04 §2.2, stretch). Enabling one vault automatically disables any
        previously enabled vault for the same owner — at most one target at a
        time.
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [enabled]
              properties:
                enabled: { type: boolean }
      responses:
        "200":
          description: updated
          content:
            application/json:
              { schema: { $ref: "#/components/schemas/Vault" } }
        "404": { description: ERR_VAULT_NOT_FOUND }

  /v1/money-requests:
    post:
      tags: [money-requests]
      summary: Ask someone to pay you (single request, 72h TTL)
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [payer_phone, amount]
              properties:
                payer_phone: { type: string }
                amount:
                  {
                    type: integer,
                    format: int64,
                    description: minor units (VND),
                  }
                note: { type: string, maxLength: 255 }
      responses:
        "201": { description: "{id, amount, status, expires_at}; a replay of the same key and payload returns the original request" }
        "400": { description: ERR_IDEMPOTENCY_KEY_REQUIRED / ERR_AMOUNT_INVALID / ERR_SELF_REQUEST }
        "404": { description: ERR_RECEIVER_NOT_FOUND }
        "409": { description: ERR_IDEMPOTENCY_KEY_REUSED (key already used by you with a different payload) }

  /v1/money-requests/split:
    post:
      tags: [money-requests]
      summary: Split Bill — one request per payer under a shared split_group_id (even split when amounts is omitted, largest-remainder — no float)
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [payer_phones, total_amount]
              properties:
                payer_phones:
                  { type: array, items: { type: string }, minItems: 1 }
                total_amount:
                  {
                    type: integer,
                    format: int64,
                    description: minor units (VND),
                  }
                note: { type: string, maxLength: 255 }
                amounts:
                  {
                    type: array,
                    items: { type: integer, format: int64 },
                    description: "optional custom shares, must sum to total_amount and match payer_phones length",
                  }
      responses:
        "201": { description: "{split_group_id, requests: [...]}; a replay of the same key and payload returns the original split" }
        "400":
          {
            description: ERR_IDEMPOTENCY_KEY_REQUIRED / ERR_AMOUNT_INVALID / ERR_SELF_REQUEST / ERR_VALIDATION (bad split),
          }
        "404": { description: ERR_RECEIVER_NOT_FOUND }
        "409": { description: ERR_IDEMPOTENCY_KEY_REUSED (key already used by you with a different payload) }

  /v1/money-requests/inbox:
    get:
      tags: [money-requests]
      summary: Requests where I am the payer — still pending and not past their deadline
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          {
            description: "{requests: [{id, requester_name, amount, note, split_group_id, expires_at, last_reminded_at}]}",
          }

  /v1/money-requests/sent:
    get:
      tags: [money-requests]
      summary: Requests I created (any status), newest first
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          {
            description: "{requests: [{id, payer_name, amount, note, split_group_id, status, expires_at, last_reminded_at}]}",
          }

  /v1/money-requests/{id}:
    get:
      tags: [money-requests]
      summary: Detail — owner (requester or that payer) only; includes split siblings when part of a Split Bill
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/RequestId" }]
      responses:
        "200":
          {
            description: "{id, amount, status, paid_txn_id, expires_at, last_reminded_at, siblings?}",
          }
        "404": { description: ERR_REQUEST_NOT_FOUND }

  /v1/money-requests/{id}/decline:
    post:
      tags: [money-requests]
      summary: Payer declines
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/RequestId" }]
      responses:
        "200": { description: "{status: declined}" }
        "403": { description: ERR_FORBIDDEN }
        "404": { description: ERR_REQUEST_NOT_FOUND }
        "409": { description: ERR_REQUEST_NOT_PAYABLE }

  /v1/money-requests/{id}/cancel:
    post:
      tags: [money-requests]
      summary: Requester cancels
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/RequestId" }]
      responses:
        "200": { description: "{status: canceled}" }
        "403": { description: ERR_FORBIDDEN }
        "404": { description: ERR_REQUEST_NOT_FOUND }
        "409": { description: ERR_REQUEST_NOT_PAYABLE }

  /v1/money-requests/{id}/remind:
    post:
      tags: [money-requests]
      summary: Send a reminder to the payer (once per 24 hours)
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/RequestId" }]
      responses:
        "200":
          description: reminder sent/updated
          content:
            application/json:
              schema:
                type: object
                required: [last_reminded_at]
                properties:
                  last_reminded_at: { type: string, format: date-time }
        "403": { description: ERR_FORBIDDEN }
        "404": { description: ERR_REQUEST_NOT_FOUND }
        "409": { description: ERR_REQUEST_NOT_PAYABLE }
        "429": { description: ERR_REMIND_TOO_SOON }

  /v1/kyc/submit:
    post:
      tags: [kyc]
      summary: Submit KYC images (id card + selfie) — scored by the kyc_verification workflow (Claude vision, mock offline)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [id_card, selfie]
              properties:
                id_card:
                  {
                    type: string,
                    format: binary,
                    description: jpeg/png,
                    max 5MB,
                  }
                selfie:
                  {
                    type: string,
                    format: binary,
                    description: jpeg/png,
                    max 5MB,
                  }
      responses:
        "202":
          { description: accepted — verdict lands async, poll /v1/kyc/status }
        "400":
          { description: ERR_VALIDATION (missing/oversized/non-image file) }
        "409":
          { description: ERR_KYC_ALREADY_PENDING / ERR_KYC_ALREADY_VERIFIED }

  /v1/kyc/status:
    get:
      tags: [kyc]
      summary: My KYC state + latest request (score and AI reasons once scored)
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          {
            description: "{kyc_status, latest_request?: {id, status, ai_score?, ai_reasons?, created_at}}",
          }

  /v1/admin/auth/login:
    post:
      tags: [admin]
      summary: Admin login (separate admin_users table, JWT aud=admin — user tokens can never call admin APIs)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string }
      responses:
        "200":
          { description: "{admin: {id,email,full_name,role}, access_token}" }
        "401": { description: ERR_INVALID_CREDENTIALS }
        "403": { description: ERR_ACCOUNT_LOCKED }
        "429": { description: "ERR_RATE_LIMITED or ERR_LOGIN_LOCKED (5 failed logins lock the admin for 15 minutes)" }

  /v1/admin/users/{id}/pin/reset:
    post:
      tags: [admin]
      summary: Operator fallback for a user who cannot receive a reset code. Removes the user's PIN (permission pin.reset, superadmin only); the user sets a new one. Never reads or sets a PIN
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, minLength: 10, maxLength: 255, description: "who verified the identity and how; stored in the audit trail" }
      responses:
        "200": { description: "{status: pin_cleared}" }
        "400": { description: ERR_VALIDATION }
        "403": { description: "ERR_FORBIDDEN_PERMISSION / ERR_PIN_NOT_SET (no PIN to clear)" }

  /v1/admin/users/{id}/totp/reset:
    post:
      tags: [admin]
      summary: Operator fallback for a user who lost the authenticator. Removes the user's TOTP and recovery codes (permission totp.reset, superadmin only). Never reads a secret
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, minLength: 10, maxLength: 255, description: "who verified the identity and how; stored in the audit trail" }
      responses:
        "200": { description: "{status: totp_removed}" }
        "400": { description: ERR_VALIDATION }
        "403": { description: "ERR_FORBIDDEN_PERMISSION / ERR_TOTP_NOT_ENROLLED (nothing to remove)" }

  /v1/admin/kyc:
    get:
      tags: [admin]
      summary: KYC review queue by tab (image links HMAC-signed, 5-minute TTL)
      security: [{ bearerAuth: [] }]
      parameters:
        - {
            name: tab,
            in: query,
            schema:
              { type: string, enum: [manual, auto, rejected], default: manual },
          }
      responses:
        "200":
          {
            description: "{requests: [{id, full_name, phone, id_card_url, selfie_url, ai_score, ai_verdict, ai_reasons, created_at}]}",
          }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /v1/admin/kyc/{id}/review:
    post:
      tags: [admin]
      summary: Decide a manual_review request — guarded transition, second racing reviewer gets 409 (admin edge A01 groundwork)
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/KycRequestId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action]
              properties:
                action: { type: string, enum: [approve, reject] }
                reason: { type: string, maxLength: 255 }
      responses:
        "200": { description: "{status: verified|rejected}" }
        "404": { description: ERR_KYC_NOT_FOUND }
        "409": { description: ERR_ALREADY_REVIEWED }

  /v1/admin/fraud-flags:
    get:
      tags: [admin]
      summary: Fraud flag queue by status (rule evidence + optional LLM advisory)
      security: [{ bearerAuth: [] }]
      parameters:
        - {
            name: status,
            in: query,
            schema:
              {
                type: string,
                enum: [open, cleared, confirmed_fraud],
                default: open,
              },
          }
      responses:
        "200":
          {
            description: "{flags: [{id, ref_code, rule_code, score, reasons, status, created_at}]}",
          }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /v1/admin/fraud-flags/{id}/resolve:
    post:
      tags: [admin]
      summary: Resolve a fraud flag (clear or confirm) — guarded, does not auto-lock the account
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/FlagId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action]
              properties:
                action: { type: string, enum: [clear, confirm_fraud] }
                reason: { type: string, maxLength: 255 }
      responses:
        "200": { description: resolved }
        "404": { description: ERR_FLAG_NOT_FOUND }
        "409": { description: ERR_ALREADY_RESOLVED }

  /v1/admin/reversals:
    post:
      tags: [admin]
      summary: File a reversal request for a completed transaction (admin maker; a different admin must approve)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ref_code]
              properties:
                ref_code: { type: string }
                reason: { type: string, maxLength: 255 }
      responses:
        "201": { description: "{request_id, ref_code}" }
        "404": { description: ERR_TXN_NOT_FOUND }
        "409":
          {
            description: ERR_TXN_NOT_REVERSIBLE / ERR_ALREADY_REVERSED / ERR_REVERSAL_PENDING,
          }

  /v1/admin/approvals:
    get:
      tags: [admin]
      summary: Admin My Tasks — pending admin-operation requests (reversal, etc.)
      security: [{ bearerAuth: [] }]
      parameters:
        - {
            name: status,
            in: query,
            schema: { type: string, enum: [pending, needs_manual], default: pending },
          }
      responses:
        "200":
          {
            description: "{approvals: [{id, subject_type, subject_id, ref_code, amount, fee, created_by, expires_at}]}",
          }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /v1/admin/attention/summary:
    get:
      tags: [admin]
      summary: Read-only counts of parked money cases for the admin alert badge (G12) - needs_manual approvals and compensation_failed workflow instances. Needs workflow.action.
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: "{needs_manual_approvals, compensation_failed_workflows, total}" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { description: ERR_FORBIDDEN_PERMISSION }

  /v1/admin/approvals/{id}/decide:
    post:
      tags: [admin]
      summary: Decide an admin request — Maker ≠ Checker; on final approval the executor runs in the same tx (e.g. reversal posts the mirror ledger entries)
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/ApprovalId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action]
              properties:
                action: { type: string, enum: [approve, reject] }
                reason: { type: string, maxLength: 255 }
      responses:
        "200": { description: "{status: pending|approved|rejected}" }
        "403": { description: ERR_SELF_APPROVAL }
        "404": { description: ERR_APPROVAL_NOT_FOUND }
        "409": { description: ERR_ALREADY_FINALIZED / ERR_ALREADY_ACTED }

  /v1/admin/recon/run:
    post:
      tags: [admin]
      summary: Run reconciliation for a date (cron also runs 00:15 for the previous day)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [date]
              properties:
                date: { type: string, format: date, example: "2026-07-12" }
      responses:
        "201": { description: "{run_id, date}" }
        "400": { $ref: "#/components/responses/Validation" }
        "409": { description: ERR_RECON_ALREADY_RAN }

  /v1/admin/recon/runs/{date}:
    get:
      tags: [admin]
      summary: Reconciliation run for a date (items + ai_summary + signed xlsx report_url)
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/ReconDate" }]
      responses:
        "200": { description: "{run, items, report_url}" }
        "404": { description: ERR_RECON_NOT_FOUND }

  /v1/admin/ai/keys:
    get:
      tags: [admin]
      summary: List AI provider API keys
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: "list of AI keys" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [admin]
      summary: Create an AI provider API key
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, provider, api_key]
              properties:
                name: { type: string, maxLength: 100 }
                provider: { type: string, enum: [anthropic, openai] }
                api_key: { type: string, maxLength: 255 }
      responses:
        "200": { description: "created AI key" }
        "400": { $ref: "#/components/responses/Validation" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /v1/admin/ai/keys/{id}:
    put:
      tags: [admin]
      summary: Update an AI key (name, rotate api_key, toggle is_active)
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, maxLength: 100 }
                api_key: { type: string, description: "omit or empty to keep current" }
                is_active: { type: boolean }
      responses:
        "200": { description: "updated AI key" }
        "400": { $ref: "#/components/responses/Validation" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { description: ERR_NOT_FOUND }

  /v1/admin/ai/settings:
    get:
      tags: [admin]
      summary: List AI function settings (provider/model/key per function)
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: "list of AI settings" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    put:
      tags: [admin]
      summary: Set provider/model/key for an AI function
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [function_name, provider, model_name]
              properties:
                function_name: { type: string, enum: [kyc_scoring, fraud_advising] }
                provider: { type: string, enum: [anthropic, openai, mock] }
                model_name: { type: string, maxLength: 100 }
                key_id: { type: string, format: uuid }
      responses:
        "200": { description: "updated AI setting" }
        "400": { description: "ERR_VALIDATION or ERR_KEY_INACTIVE" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { description: ERR_KEY_NOT_FOUND }

  /v1/admin/services:
    get:
      tags: [admin]
      summary: Service catalog (all services, any status)
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: "{services: [...]}" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /v1/admin/services/{id}:
    get:
      tags: [admin]
      summary: Service detail
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: service }
        "404": { description: ERR_SERVICE_NOT_FOUND }
    put:
      tags: [admin]
      summary: Enable/disable/maintenance a service
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [active, maintenance, disabled] }
      responses:
        "200": { description: updated service }
        "400": { $ref: "#/components/responses/Validation" }
        "404": { description: ERR_SERVICE_NOT_FOUND }

  /v1/admin/offers:
    get:
      tags: [admin]
      summary: Offer catalog (offer = a bundle of services for a role)
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: "{offers: [...]}" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /v1/admin/offers/{id}:
    get:
      tags: [admin]
      summary: Offer detail with its bundled services
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: "{offer, services}" }
        "404": { description: ERR_OFFER_NOT_FOUND }

  /v1/admin/workflows:
    get:
      tags: [admin]
      summary: Workflow instances — engine debugging/ops. Filters — status (accepts the enum or the short alias "waiting" for waiting_approval), definition (name needle), stuck_only (running + older than 5 min), name (ref_code needle), from/to
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: "{workflows: [...]}" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /v1/admin/workflows/{id}:
    get:
      tags: [admin]
      summary: Workflow instance detail + its step executions
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: "{instance, steps}" }
        "404": { description: ERR_WORKFLOW_NOT_FOUND }

  /v1/admin/audit:
    get:
      tags: [admin]
      summary: Audit log — paginated, with free-text search (name, matches action/resource/reason) and a from/to created_at range
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: "{logs: [...], total}" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /v1/admin/orgs:
    get:
      tags: [admin]
      summary: Organizations overview for admin ops — every org (not scoped to caller membership like GET /v1/org), paginated, with member/policy/pending-approval counts
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: "{organizations: [...], total, page, limit, total_pages}" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /v1/admin/orgs/{id}/policies:
    put:
      tags: [admin]
      summary: Platform-ops override — create a new approval policy version for an org (admin console "Tổ chức & Policy"), distinct from POST /v1/org/{id}/policies which requires org membership
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/OrgId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, tiers]
              properties:
                name: { type: string, maxLength: 100 }
                min_amount: { type: integer, format: int64, default: 0 }
                max_amount:
                  {
                    type: integer,
                    format: int64,
                    nullable: true,
                    description: null = no cap,
                  }
                tiers:
                  type: array
                  items:
                    type: object
                    required: [level, required_approvals]
                    properties:
                      level: { type: integer, minimum: 1 }
                      required_approvals: { type: integer, minimum: 1 }
      responses:
        "201": { description: "{policy_id, version}" }
        "400": { description: ERR_INVALID_POLICY }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { description: ERR_ORG_NOT_FOUND / ERR_ORG_INACTIVE }

  /v1/files/{key}:
    get:
      tags: [admin]
      summary: Stream a stored artifact (KYC image or recon xlsx) — the HMAC signature in the query IS the authorization (no JWT), expires in 5 minutes
      parameters:
        - { name: key, in: path, required: true, schema: { type: string } }
        - {
            name: exp,
            in: query,
            required: true,
            schema: { type: integer, format: int64 },
          }
        - { name: sig, in: query, required: true, schema: { type: string } }
      responses:
        "200": { description: artifact bytes }
        "403": { description: ERR_INVALID_SIGNATURE }
        "404": { description: ERR_FILE_NOT_FOUND }
        "410": { description: ERR_LINK_EXPIRED }

  /v1/org:
    get:
      tags: [org]
      summary: List user's organization memberships with role and wallet balance
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: List of organizations
          content:
            application/json:
              schema:
                type: object
                required: [organizations]
                properties:
                  organizations:
                    type: array
                    items:
                      type: object
                      required: [org_id, name, role, checker_level, wallet_id, balance]
                      properties:
                        org_id: { type: string, format: uuid }
                        name: { type: string }
                        role: { type: string, enum: [admin, maker, checker] }
                        checker_level: { type: integer }
                        wallet_id: { type: string, format: uuid }
                        balance: { type: integer, format: int64 }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [org]
      summary: Create an organization (creator becomes org admin; org wallet auto-provisioned)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, minLength: 2, maxLength: 200 }
      responses:
        "201": { description: "{org_id, wallet_id, name}" }
        "400": { $ref: "#/components/responses/Validation" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /v1/org/{id}/members:
    post:
      tags: [org]
      summary: Add a member by phone (org admin only)
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/OrgId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone, role]
              properties:
                phone: { type: string }
                role: { type: string, enum: [admin, maker, checker] }
                checker_level:
                  {
                    type: integer,
                    minimum: 1,
                    description: required when role=checker,
                  }
      responses:
        "201": { description: member added }
        "403": { description: ERR_NOT_ORG_MEMBER / ERR_FORBIDDEN_ROLE }
        "404": { description: ERR_USER_NOT_FOUND }
        "409": { description: ERR_MEMBER_EXISTS }

  /v1/org/{id}/policies:
    post:
      tags: [org]
      summary: Create a new approval policy version (org admin; old version deactivated, in-flight requests keep their snapshot — E09)
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/OrgId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, tiers]
              properties:
                name: { type: string, maxLength: 100 }
                min_amount: { type: integer, format: int64, default: 0 }
                max_amount:
                  {
                    type: integer,
                    format: int64,
                    nullable: true,
                    description: null = no cap,
                  }
                tiers:
                  type: array
                  items:
                    type: object
                    required: [level, required_approvals]
                    properties:
                      level: { type: integer, minimum: 1 }
                      required_approvals: { type: integer, minimum: 1 }
      responses:
        "201": { description: "{policy_id, version}" }
        "400": { description: ERR_INVALID_POLICY }
        "403": { description: ERR_NOT_ORG_MEMBER / ERR_FORBIDDEN_ROLE }

  /v1/org/{id}/transactions:
    post:
      tags: [org]
      summary: Maker creates an org disbursement — approval-gated by the org's active policy (F6)
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: "#/components/parameters/OrgId" }
        - {
            name: Idempotency-Key,
            in: header,
            required: true,
            schema: { type: string, maxLength: 64 },
          }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone, amount]
              properties:
                phone: { type: string, description: receiver phone }
                amount: { type: integer, format: int64 }
                note: { type: string }
      responses:
        "201":
          {
            description: disbursement created (workflow started, gated at WAIT_APPROVAL),
            content:
              {
                application/json:
                  { schema: { $ref: "#/components/schemas/DisbursementResult" } },
              },
          }
        "400":
          {
            description: ERR_IDEMPOTENCY_KEY_REQUIRED / ERR_VALIDATION / ERR_AMOUNT_INVALID / ERR_LIMIT_EXCEEDED / ERR_NO_POLICY / ERR_INSUFFICIENT_BALANCE,
          }
        "403": { description: ERR_NOT_ORG_MEMBER / ERR_FORBIDDEN_ROLE / ERR_ORG_INACTIVE }
        "404": { description: ERR_RECEIVER_NOT_FOUND / ERR_WALLET_NOT_FOUND }

  /v1/org/approvals:
    get:
      tags: [approvals]
      summary: My Tasks — pending requests whose current tier matches my checker level and I have not acted on
      security: [{ bearerAuth: [] }]
      parameters:
        - {
            name: status,
            in: query,
            schema: { type: string, enum: [pending, needs_manual], default: pending },
          }
      responses:
        "200":
          {
            description: "{approvals: [{id, org_name, ref_code, amount, fee, maker_name, current_level, expires_at}]}",
          }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /v1/org/approvals/{id}:
    get:
      tags: [approvals]
      summary: Full status + signature history for one request — viewable by its maker or any member of the owning org
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/ApprovalId" }]
      responses:
        "200":
          {
            description: "{id, status, current_level, org_id, org_name, ref_code, amount, fee, maker_id, maker_name, created_at, expires_at, finalized_at?, policy_name, signatures_required, signatures: [{checker_id, checker_name, level, action, acted_at}]}",
          }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404":
          {
            description: ERR_APPROVAL_NOT_FOUND (also when the caller has no standing to view it — existence not revealed),
          }

  /v1/org/approvals/by-ref/{ref_code}:
    get:
      tags: [approvals]
      summary: Resolve an approval request's detail by its transaction ref_code — for the maker to poll right after CreateDisbursement, before the pause hook has created the approval_request row
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: ref_code, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          {
            description: "same shape as GET /v1/org/approvals/{id}",
          }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404":
          {
            description: ERR_APPROVAL_NOT_FOUND (also when the approval_request has not been created yet, or the caller has no standing to view it),
          }

  /v1/org/approvals/{id}/challenge:
    post:
      tags: [approvals]
      summary: Eligibility check + issue signing OTP (rate-limited; code returned in response only when ENV=dev)
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/ApprovalId" }]
      responses:
        "200": { description: "{status: otp_sent, otp_dev?}" }
        "403": { description: ERR_FORBIDDEN_ROLE / ERR_WRONG_LEVEL }
        "404":
          {
            description: ERR_APPROVAL_NOT_FOUND (also for non-members — existence not revealed),
          }
        "409": { description: ERR_ALREADY_FINALIZED / ERR_ALREADY_ACTED }
        "410": { description: ERR_APPROVAL_EXPIRED }
        "429": { description: ERR_OTP_COOLDOWN / ERR_RATE_LIMITED }

  /v1/org/approvals/{id}/decide:
    post:
      tags: [approvals]
      summary: Sign one decision with OTP — finalizes when the policy snapshot is satisfied (E08/E09)
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/ApprovalId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action, otp]
              properties:
                action: { type: string, enum: [approve, reject] }
                otp: { type: string, minLength: 6, maxLength: 6 }
      responses:
        "200":
          { description: "{status: pending|approved|rejected, current_level?}" }
        "400":
          {
            description: ERR_OTP_INVALID / ERR_OTP_EXPIRED / ERR_OTP_MAX_ATTEMPTS,
          }
        "403": { description: ERR_FORBIDDEN_ROLE / ERR_WRONG_LEVEL }
        "404": { description: ERR_APPROVAL_NOT_FOUND }
        "409": { description: ERR_ALREADY_FINALIZED / ERR_ALREADY_ACTED }
        "410": { description: ERR_APPROVAL_EXPIRED }

  /v1/org/approvals/{id}/cancel:
    post:
      tags: [approvals]
      summary: Maker withdraws their own still-pending request (mockup "Hủy lệnh") — reuses the same finalize path as a checker reject
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/ApprovalId" }]
      responses:
        "200": { description: "{status: cancelled}" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404":
          {
            description: ERR_APPROVAL_NOT_FOUND (also when the caller is not this request's maker — existence not revealed),
          }
        "409": { description: ERR_ALREADY_FINALIZED (request is no longer pending) }

components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Scoped to the calling user and bound to the request payload. Same key and same payload returns the original result; same key and a different payload is 409 ERR_IDEMPOTENCY_KEY_REUSED. Another user's identical key never collides.
      schema: { type: string, maxLength: 64 }
    DeviceId:
      name: X-Device-Id
      in: header
      required: false
      schema: { type: string, maxLength: 80 }
    RefCode:
      name: refCode
      in: path
      required: true
      schema: { type: string, example: MP7F3A9C21D4E5 }
    OrgId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    ApprovalId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    RequestId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    KycRequestId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    FlagId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    ReconDate:
      name: date
      in: path
      required: true
      schema: { type: string, format: date, example: "2026-07-12" }
  responses:
    Unauthorized:
      description: missing/invalid bearer token (ERR_INVALID_TOKEN / ERR_TOKEN_EXPIRED)
      content:
        { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    Validation:
      description: ERR_VALIDATION
      content:
        { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
  schemas:
    Health:
      type: object
      properties:
        status: { type: string, enum: [ok, degraded] }
        role: { type: string }
        checks: { type: object, additionalProperties: { type: string } }
    Error:
      type: object
      required: [code, message]
      properties:
        code: { type: string, example: ERR_INSUFFICIENT_BALANCE }
        message: { type: string }
        request_id: { type: string }
    TokenPair:
      type: object
      properties:
        access_token: { type: string, description: JWT, 15 minutes }
        refresh_token:
          { type: string, description: opaque, 30 days, single-use (rotation) }
        expires_in: { type: integer, format: int64 }
    User:
      type: object
      properties:
        id: { type: string, format: uuid }
        phone: { type: string }
        full_name: { type: string }
        kyc_status:
          {
            type: string,
            enum:
              [none, pending, auto_approved, manual_review, verified, rejected],
          }
    AuthResponse:
      type: object
      properties:
        user: { $ref: "#/components/schemas/User" }
        tokens: { $ref: "#/components/schemas/TokenPair" }
    Wallet:
      type: object
      required: [id, currency, purpose, balance]
      properties:
        id: { type: string, format: uuid }
        currency: { type: string, example: VND }
        purpose: { type: string, example: main }
        label: { type: string, nullable: true }
        balance:
          { type: integer, format: int64, description: minor units (VND) }
    TopupResult:
      type: object
      required: [ref_code, status, amount, created_at]
      properties:
        ref_code: { type: string }
        status: { type: string }
        amount: { type: integer, format: int64 }
        new_balance: { type: integer, format: int64 }
        created_at: { type: string, format: date-time }
        duplicate: { type: boolean }
    TransferResult:
      type: object
      required: [ref_code, status, amount, fee, total, created_at]
      properties:
        ref_code: { type: string }
        status: { type: string }
        amount: { type: integer, format: int64 }
        fee: { type: integer, format: int64 }
        total: { type: integer, format: int64 }
        created_at: { type: string, format: date-time }
        duplicate: { type: boolean }
    DisbursementResult:
      type: object
      required: [ref_code, status, amount, fee, total, created_at]
      properties:
        ref_code: { type: string }
        status: { type: string }
        amount: { type: integer, format: int64 }
        fee: { type: integer, format: int64 }
        total: { type: integer, format: int64 }
        created_at: { type: string, format: date-time }
        duplicate: { type: boolean }
    Vault:
      type: object
      description: A savings pocket. Backed by a wallets row with purpose='vault', so its balance is ledger-derived like any other wallet.
      properties:
        id: { type: string, format: uuid }
        label: { type: string, example: "Du lịch Đà Lạt" }
        balance: { type: integer, format: int64, description: minor units (VND) }
        target_amount:
          {
            type: integer,
            format: int64,
            description: savings goal; 0 when not set. Display only — never blocks a withdrawal,
          }
        round_up_target:
          type: boolean
          description: >
            True if this vault receives the ROUND_UP step's swept difference
            from the caller's P2P spends (docs 04 §2.2, stretch). At most one
            vault per user can be true at a time.

    EngineRequestResult:
      type: object
      required:
        [
          transaction_id,
          ref_code,
          status,
          service_code,
          amount,
          fee,
          total,
          auth_required,
          created_at,
        ]
      properties:
        transaction_id: { type: string, format: uuid }
        ref_code: { type: string }
        status: { type: string }
        service_code: { type: string }
        amount: { type: integer, format: int64 }
        fee: { type: integer, format: int64 }
        total: { type: integer, format: int64 }
        auth_required:
          {
            type: string,
            description: "none | pin | otp | 2fa — which of /confirm or /verify the client must call next",
          }
        created_at: { type: string, format: date-time }
    TxnView:
      type: object
      description: Owner-facing transaction. Counterparty identity is server-masked; null when the other side is a system or org wallet.
      required:
        [
          id,
          ref_code,
          type,
          status,
          sender_wallet_id,
          receiver_wallet_id,
          amount,
          fee,
          direction,
          counterparty_name,
          counterparty_phone,
          created_at,
        ]
      properties:
        id: { type: string, format: uuid }
        ref_code: { type: string, example: MP7F3A9C21D4E5 }
        type: { type: string, enum: [topup, p2p, org_disbursement, reversal] }
        status:
          {
            type: string,
            enum:
              [
                created,
                processing,
                pending_approval,
                completed,
                failed,
                reversed,
              ],
          }
        sender_wallet_id: { type: string, format: uuid }
        receiver_wallet_id: { type: string, format: uuid }
        amount: { type: integer, format: int64, description: minor units (VND) }
        fee: { type: integer, format: int64 }
        note: { type: string }
        direction:
          {
            type: string,
            enum: [in, out],
            description: relative to the caller's main wallet,
          }
        counterparty_name:
          { type: string, nullable: true, example: "Nguyễn V** A*" }
        counterparty_phone:
          { type: string, nullable: true, example: "091****678" }
        created_at: { type: string, format: date-time }
        completed_at: { type: string, format: date-time }
    TimelineStep:
      type: object
      required: [step, status, attempt]
      properties:
        step: { type: string, example: MOVE_FUNDS }
        status:
          { type: string, enum: [running, completed, failed, compensated] }
        attempt: { type: integer }
        finished_at: { type: string, format: date-time }
    Timeline:
      type: object
      required: [instance_status, steps]
      properties:
        instance_status:
          {
            type: string,
            enum:
              [
                none,
                running,
                waiting_approval,
                completed,
                failed,
                compensating,
                compensated,
                recovering,
              ],
          }
        current_step: { type: string }
        failure_code:
          type: string
          description: Stable ERR_* for the terminal failure (ERR_INSUFFICIENT_BALANCE / ERR_FRAUD_BLOCKED / ERR_ACCOUNT_INACTIVE / ERR_TRANSFER_FAILED). Present only when instance_status is failed or compensated.
        steps:
          type: array
          items: { $ref: "#/components/schemas/TimelineStep" }
