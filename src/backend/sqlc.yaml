version: "2"
sql:
  - engine: "postgresql"
    schema: "db/migrations"
    queries: "internal/store/queries"
    gen:
      go:
        package: "store"
        out: "internal/store/gen"
        sql_package: "pgx/v5"
        emit_json_tags: true
        overrides:
          - db_type: "uuid"
            go_type: "github.com/google/uuid.UUID"
          # Nullable uuid columns also map to uuid.UUID so params stay ergonomic.
          # Convention: queries must NEVER SELECT a nullable uuid column
          # (owner_id, reversal_of, split_group_id...) — scanning NULL into
          # uuid.UUID fails at runtime. Use explicit column lists.
          - db_type: "uuid"
            nullable: true
            go_type: "github.com/google/uuid.UUID"
