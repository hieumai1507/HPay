name: backend-ci
on:
  push: { branches: [main], paths: ["src/backend/**", ".github/workflows/backend-ci.yml"] }
  pull_request: { paths: ["src/backend/**", ".github/workflows/backend-ci.yml"] }

defaults:
  run:
    working-directory: src/backend

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: src/backend/go.mod }
      - uses: sqlc-dev/setup-sqlc@v4
        with: { sqlc-version: "1.27.0" }
      - run: sqlc generate --no-remote
      - run: go mod tidy
      - name: gofmt
        run: test -z "$(gofmt -l cmd internal)" || (gofmt -l cmd internal && exit 1)
      - run: go vet ./...
      - name: openapi spec in sync with router (user rule)
        run: python3 scripts/check-openapi-sync.py
      # TODO(F2): reintroduce golangci-lint pinned to a version matching go.mod toolchain

  sqlc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: sqlc-dev/setup-sqlc@v4
        with: { sqlc-version: "1.27.0" }
      - run: sqlc vet || true   # vet needs DB for some rules; generate is the real gate
      - run: sqlc generate --no-remote
      - run: test -d internal/store/gen && echo "sqlc generate OK"

  migrate:  # E18 — up -> down -> up on a clean database, then prove ledger is append-only
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: HPay, POSTGRES_PASSWORD: HPay, POSTGRES_DB: HPay }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U HPay" --health-interval 3s --health-retries 10
    env:
      DB_URL: postgres://HPay:HPay@localhost:5432/HPay?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - name: install migrate
        run: |
          curl -fsSL https://github.com/golang-migrate/migrate/releases/download/v4.17.1/migrate.linux-amd64.tar.gz | tar xz
          sudo mv migrate /usr/local/bin/
      - run: migrate -path db/migrations -database "$DB_URL" up
      - run: migrate -path db/migrations -database "$DB_URL" down -all
      - run: migrate -path db/migrations -database "$DB_URL" up
      - name: ledger append-only trigger holds
        run: |
          sudo apt-get install -y postgresql-client >/dev/null
          psql "$DB_URL" -c "INSERT INTO users (phone, password_hash, full_name) VALUES ('0900000000','x','CI User');"
          # owner_id is NOT NULL; system wallets use the all-zero owner, same as
          # the seed rows in 000002. purpose defaults to 'main', which does not
          # collide with the seeded system_cash/system_fee/system_suspense rows.
          psql "$DB_URL" -c "INSERT INTO wallets (owner_type, owner_id, system_code) VALUES ('system','00000000-0000-0000-0000-000000000000','SYSTEM_CI');"
          # A real row is required: the triggers are FOR EACH ROW, so an UPDATE
          # matching nothing would "pass" against a database with no trigger at
          # all — which is exactly how this step used to give a false green.
          psql "$DB_URL" -c "INSERT INTO transactions (ref_code, type, amount, initiated_by) VALUES ('CI_TRIGGER_1','p2p',1000,(SELECT id FROM users WHERE phone='0900000000'));"
          psql "$DB_URL" -c "INSERT INTO ledger_entries (transaction_id, wallet_id, direction, amount, balance_after) VALUES ((SELECT id FROM transactions WHERE ref_code='CI_TRIGGER_1'),(SELECT id FROM wallets WHERE system_code='SYSTEM_CI'),'debit',1000,-1000);"

          if psql "$DB_URL" -v ON_ERROR_STOP=1 -c "UPDATE ledger_entries SET amount = 1;" 2>&1 | grep -q "append-only"; then
            echo "UPDATE blocked — OK"
          else
            echo "::error::ledger_entries accepted an UPDATE — the append-only trigger is missing"
            exit 1
          fi

          if psql "$DB_URL" -v ON_ERROR_STOP=1 -c "DELETE FROM ledger_entries;" 2>&1 | grep -q "append-only"; then
            echo "DELETE blocked — OK"
          else
            echo "::error::ledger_entries accepted a DELETE — the append-only trigger is missing"
            exit 1
          fi

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: HPay, POSTGRES_PASSWORD: HPay, POSTGRES_DB: HPay_test }
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U HPay" --health-interval 3s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6380:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 3s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://HPay:HPay@localhost:5433/HPay_test?sslmode=disable
      TEST_REDIS_ADDR: localhost:6380
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: src/backend/go.mod }
      - uses: sqlc-dev/setup-sqlc@v4
        with: { sqlc-version: "1.27.0" }
      - run: sqlc generate --no-remote
      - run: go mod tidy
      - name: migrate test db
        run: |
          curl -fsSL https://github.com/golang-migrate/migrate/releases/download/v4.17.1/migrate.linux-amd64.tar.gz | tar xz
          sudo mv migrate /usr/local/bin/
          migrate -path db/migrations -database "$TEST_DATABASE_URL" up
      # -p 1: packages that pump the shared outbox must not run concurrently
      # (testutil.RunSerialized doc) — parallel binaries steal each other's events.
      - run: go test -p 1 ./... -race -count=1
        env:
          APP_ENV: ci
      - run: bash ./scripts/check-edge-tests.sh # F10: full default gate E01–E20

  build:
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: src/backend/go.mod }
      - uses: sqlc-dev/setup-sqlc@v4
        with: { sqlc-version: "1.27.0" }
      - run: sqlc generate --no-remote
      - run: go mod tidy
      - run: CGO_ENABLED=0 go build -o /tmp/HPay ./cmd/server

  vuln: # F10: known-vulnerability scan on Go deps + stdlib call paths
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: src/backend/go.mod }
      - uses: sqlc-dev/setup-sqlc@v4
        with: { sqlc-version: "1.27.0" }
      - run: sqlc generate --no-remote
      - run: go mod tidy
      - run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - run: govulncheck ./...

  image-scan: # F10: container image scan, HIGH/CRITICAL fail the build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: build image
        run: docker build -t hpay-backend:ci .
      - uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: hpay-backend:ci
          format: table
          exit-code: "1"
          severity: HIGH,CRITICAL
          ignore-unfixed: true
