name: mobile-ci

on:
  push:
    branches: [main]
    paths: ['src/mobile/**', '.github/workflows/mobile-ci.yml']
  pull_request:
    branches: [main]
    paths: ['src/mobile/**', '.github/workflows/mobile-ci.yml']

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: src/mobile/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm test -- --ci