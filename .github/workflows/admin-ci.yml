name: admin-ci

on:
  push:
    branches: [main]
    paths: ['src/admin/**', 'src/backend/**', '.github/workflows/admin-ci.yml']
  pull_request:
    branches: [main]
    paths: ['src/admin/**', 'src/backend/**', '.github/workflows/admin-ci.yml']

jobs:
  # Full-stack Playwright E2E suite (e2e/), per
  # docs/plans/admin/e2e-playwright-suite/implementation-plan.html §7.
  #
  # Blocking: trial period is over (verified green — 29 passed, 2 skipped,
  # 0 failed, repeatedly against a fresh seed) and all 5 real bugs the suite
  # found while it was advisory are fixed. Also add
  # "e2e" to this repo's branch protection required status checks on GitHub
  # (Settings → Branches → main) — a job failing here only blocks the merge
  # button if it's *also* required there; this file alone can't enforce that.
  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: HPay
          POSTGRES_PASSWORD: HPay
          POSTGRES_DB: HPay
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U HPay" --health-interval 3s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 3s --health-retries 10
    env:
      DATABASE_URL: postgres://HPay:HPay@localhost:5432/HPay?sslmode=disable
      REDIS_ADDR: localhost:6379
      E2E_BASE_URL: http://localhost:4173
      CI: true
      # internal/platform/config.Load fails fast without this — a CI-only
      # value, never used for anything real. APP_ENV=ci (explicit, required) so it
      # defaults to "dev", where the >=32-byte length check is skipped, but
      # this value clears it anyway.
      APP_ENV: ci
      JWT_SECRET: ci-e2e-only-secret-not-for-real-use-32b
    steps:
      - uses: actions/checkout@v4

      # Monorepo: backend va admin cung repo, khong can PAT / checkout rieng.
      - uses: actions/setup-go@v5
        with: { go-version-file: src/backend/go.mod }

      - uses: sqlc-dev/setup-sqlc@v4
        with: { sqlc-version: '1.27.0' }

      - name: build + migrate + seed backend
        working-directory: src/backend
        run: |
          sqlc generate --no-remote
          curl -fsSL https://github.com/golang-migrate/migrate/releases/download/v4.17.1/migrate.linux-amd64.tar.gz | tar xz
          sudo mv migrate /usr/local/bin/
          migrate -path db/migrations -database "$DATABASE_URL" up
          go build -o /tmp/hpay-server ./cmd/server
          go run ./cmd/seed --e2e-admins

      - name: start backend
        working-directory: src/backend
        run: |
          /tmp/hpay-server &
          npx --yes wait-on http://localhost:8080/healthz -t 30000

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: src/admin/package-lock.json

      - name: install + build admin
        working-directory: src/admin
        run: |
          npm ci
          npm run build
          npx playwright install --with-deps chromium

      - name: serve admin (preview build)
        working-directory: src/admin
        run: |
          npx vite preview --port 4173 &
          npx wait-on http://localhost:4173 -t 15000

      - name: run Playwright
        working-directory: src/admin
        run: npx playwright test --project=chromium

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: src/admin/playwright-report/
          retention-days: 7
